if(t==="brac"){let s=`<ellipse cx="100" cy="100" rx="72" ry="40" fill="none" stroke="url(#g-${m})" stroke-width="4" stroke-dasharray="1 5" stroke-linecap="round"/>`;for(let i=0;i<10;i++){const a=Math.PI*(.15+(i%5)*.175)+(i<5?Math.PI:0);s+=fl(Math.round(100+72*Math.cos(a)),Math.round(100+40*Math.sin(a)),i%5==2?17:12,5+(i%2),m)}return v(s)}
return v(ln(62,60,78)+ln(138,60,78)+fl(62,100,24,5,m)+fl(138,100,24,5,m))}

/* ---------- page build (runs once; language switch only updates text) ---------- */
const items=[];
function reg(el,t,m){el.innerHTML=art(t,m);const it={el,t,m,vis:false,ready:false,dirty:1,drag:false};el._it=it;items.push(it)}
reg($("#heroArt"),"ring","rose");reg($("#aboutArt"),"pend","yellow");
$("#grid").innerHTML=P.map(p=>`<article class="card"><div class="art"></div><div class="info"><h3></h3><p class="spec"></p><div class="price">$${fmt(p.usd)}<small>≈ ${fmt(p.usd*390)} ֏</small></div></div></article>`).join("");
$$("#grid .art").forEach((el,i)=>reg(el,P[i].t,P[i].m));
const metaD=$("meta[name=description]");
function setLang(l){const d=T[l];document.documentElement.lang=l;document.title=d.title;metaD.content=d.desc;
$$("[data-i18n]").forEach(e=>e.textContent=d[e.dataset.i18n]);
$$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
$$("#grid .card").forEach((c,i)=>{c.querySelector("h3").textContent=d.n[i];c.querySelector(".spec").textContent=d.spec.replace("{m}",d["m_"+P[i].m]).replace("{ct}",P[i].ct)});
try{localStorage.setItem("be-lang",l)}catch(e){}}
$(".lang").addEventListener("click",e=>{const l=e.target.dataset&&e.target.dataset.l;if(l)setLang(l)});
let L="hy";try{const s=localStorage.getItem("be-lang");if(s&&T[s])L=s;else{const n=(navigator.language||"").slice(0,2);L=T[n]?n:"hy"}}catch(e){}
setLang(L);

/* ---------- 3D: three.js is loaded lazily (first interaction or 3 s after load), scenes are built only when visible ---------- */
let R3,ET,CAM,IO,raf=0,last=0,TS=0;const S=448,reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const MC={yellow:0xe6bb5c,rose:0xe3a190,white:0xeef1f3},MAT={};let DIA,SPH;
function start3d(){if(TS)return;TS=1;const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";s.async=true;
s.onload=()=>{IO=new IntersectionObserver(es=>{es.forEach(e=>{const it=e.target._it;it.vis=e.isIntersecting;if(it.vis){it.dirty=1;if(!it.ready&&!it.fail){try{init3(it)}catch(x){it.fail=1}}}});kick()},{rootMargin:"120px"});items.forEach(it=>IO.observe(it.el))};
document.head.appendChild(s)}
["pointerdown","scroll","keydown","touchstart"].forEach(ev=>addEventListener(ev,start3d,{once:true,passive:true}));
addEventListener("load",()=>setTimeout(start3d,3000));
function env3(r){const s=new THREE.Scene();s.add(new THREE.Mesh(new THREE.SphereGeometry(50,24,12),new THREE.MeshBasicMaterial({color:0x4a5550,side:THREE.BackSide})));
const P_=(x,y,z,w,h,c,k)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);s.add(m)};
P_(0,32,10,30,30,0xffffff,4);P_(-32,5,12,10,34,0xffffff,3);P_(32,5,-10,10,30,0xfff0d8,3);P_(0,-18,32,40,8,0xbfd7ff,2);P_(0,10,-40,34,12,0xffffff,3);
const g=new THREE.PMREMGenerator(r),t=g.fromScene(s,.04).texture;g.dispose();return t}
const mt=m=>MAT[m]||(MAT[m]=new THREE.MeshStandardMaterial({color:MC[m],metalness:1,roughness:.2,envMapIntensity:1.3}));
function gem(s){const g=new THREE.Group(),c=new THREE.Mesh(new THREE.CylinderGeometry(s*.6,s,s*.32,12),DIA);c.position.y=s*.16;
const p=new THREE.Mesh(new THREE.ConeGeometry(s,s*.7,12),DIA);p.rotation.x=Math.PI;p.position.y=-s*.35;g.add(c,p);return g}
function flower(m,n,r){const g=new THREE.Group(),M=mt(m);
for(let L=0;L<2;L++){const k=L?.72:1;for(let i=0;i<n;i++){const pv=new THREE.Group(),p=new THREE.Mesh(SPH,M);
p.scale.set(.36*r*k,.11*r*k,.62*r*k);p.position.z=.6*r*k;p.rotation.x=-.2;pv.rotation.y=(i+L*.5)/n*Math.PI*2;pv.position.y=L*.07*r;pv.add(p);g.add(pv)}}
const d=gem(.3*r);d.position.y=.13*r;g.add(d);return g}
function build(t,m){const o=new THREE.Group(),M=mt(m);
const add=(g,x,y,z,s,rx)=>{g.position.set(x,y,z);g.scale.setScalar(s);if(rx)g.rotation.x=rx;o.add(g)};
const cyl=(x,y,h)=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,h,8),M);c.position.set(x,y,0);o.add(c)};
const tube=(pts,closed,r)=>o.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,closed),72,r,6,closed),M));
if(t==="ring"||t==="ring2"){o.add(new THREE.Mesh(new THREE.TorusGeometry(1,.085,16,64),M));
add(flower(m,t==="ring"?6:5,1),0,1.06,0,t==="ring"?.62:.52);
if(t==="ring2")[-1,1].forEach(s=>{const l=new THREE.Mesh(SPH,M);l.scale.set(.3,.05,.12);l.position.set(s*.42,1,0);l.rotation.z=-s*.4;o.add(l)});
o.rotation.x=.3;o.position.y=-.4}
else if(t==="ear"){[-.9,.9].forEach(x=>{add(flower(m,8,1),x,.8,0,.5,Math.PI/2);cyl(x,.25,.9);add(flower(m,5,1),x,-.3,0,.3,Math.PI/2)});o.position.y=.1}
else if(t==="pend"){const P_=[];for(let i=0;i<=14;i++){const x=-1.4+i*.2;P_.push(new THREE.Vector3(x,-.5+1.7*(x/1.4)*(x/1.4),0))}tube(P_,false,.022);add(flower(m,8,1),0,-.62,0,.55,Math.PI/2);o.position.y=.2}
else if(t==="brac"){const P_=[];for(let k=0;k<24;k++){const a=k/24*Math.PI*2;P_.push(new THREE.Vector3(1.5*Math.cos(a),0,.95*Math.sin(a)))}tube(P_,true,.035);
for(let j=0;j<8;j++){const a=j/8*Math.PI*2;add(flower(m,j%2?6:5,1),1.5*Math.cos(a),.04,.95*Math.sin(a),.24)}o.rotation.x=.9;o.position.y=.3}
else{[-.85,.85].forEach(x=>add(flower(m,6,1),x,.2,0,.55,Math.PI/2))}
return o}
function init3(it){if(!R3){R3=new THREE.WebGLRenderer({antialias:true,alpha:true});R3.setSize(S,S);R3.toneMapping=THREE.ACESFilmicToneMapping;R3.toneMappingExposure=1.1;R3.outputEncoding=THREE.sRGBEncoding;
ET=env3(R3);CAM=new THREE.PerspectiveCamera(34,1,.1,50);CAM.position.set(0,1.6,6.2);CAM.lookAt(0,.45,0);
DIA=new THREE.MeshStandardMaterial({color:0xdff1ff,metalness:.2,roughness:.03,flatShading:true,envMapIntensity:2.4});SPH=new THREE.SphereGeometry(1,16,10)}
const cv=document.createElement("canvas");cv.width=cv.height=S;cv.setAttribute("aria-hidden","true");
const sc=new THREE.Scene();sc.environment=ET;const dl=new THREE.DirectionalLight(0xffffff,.5);dl.position.set(2,4,5);sc.add(dl);
const pv=new THREE.Group();pv.add(build(it.t,it.m));sc.add(pv);
it.ctx=cv.getContext("2d");it.scene=sc;it.pv=pv;draw(it);it.el.replaceChildren(cv);it.ready=1;
let x0=0;cv.addEventListener("pointerdown",e=>{it.drag=true;x0=e.clientX;cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
cv.addEventListener("pointermove",e=>{if(it.drag){it.pv.rotation.y+=(e.clientX-x0)*.012;x0=e.clientX;it.dirty=1;kick()}});
const up=()=>{it.drag=false;cv.style.cursor="grab"};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up)}
function draw(it){R3.render(it.scene,CAM);it.ctx.clearRect(0,0,S,S);it.ctx.drawImage(R3.domElement,0,0);it.dirty=0}
function kick(){if(!raf)raf=requestAnimationFrame(tick)}
function tick(t){raf=requestAnimationFrame(tick);if(t-last<33)return;const dt=Math.min(.06,(t-last)/1e3);last=t;let any=0;
items.forEach(it=>{if(!it.vis||!it.ready)return;any=1;if(!reduce&&!it.drag){it.pv.rotation.y+=dt*.55;it.dirty=1}if(it.dirty)draw(it)});
if(!any||reduce&&!items.some(i=>i.dirty&&i.vis)){cancelAnimationFrame(raf);raf=0}}
</script>
