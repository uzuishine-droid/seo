return v(`<line x1="62" y1="60" x2="62" y2="78" stroke="url(#g-${m})" stroke-width="3"/><line x1="138" y1="60" x2="138" y2="78" stroke="url(#g-${m})" stroke-width="3"/>`+fl(62,100,24,5,m)+fl(138,100,24,5,m))}
document.getElementById("heroArt").innerHTML=`<svg viewBox="0 0 200 200" aria-hidden="true" focusable="false"><g class="bloom">${fl(100,80,32,6,"rose").replace("<g>","<g>")}</g>${band(100,138,44,"rose")}</svg>`;
document.getElementById("aboutArt").innerHTML=art("pend","yellow").replace("<svg ",'<svg style="max-width:360px;margin:0 auto;display:block" ');
const MC={yellow:0xe6bb5c,rose:0xe3a190,white:0xeef1f3};
let R3,ET,CAM,items=[],last=0,started=0,IO;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function env3(r){const s=new THREE.Scene();
s.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({color:0x4a5550,side:THREE.BackSide})));
const L=(x,y,z,w,h,c,k)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);s.add(m)};
L(0,32,10,30,30,0xffffff,4);L(-32,5,12,10,34,0xffffff,3);L(32,5,-10,10,30,0xfff0d8,3);L(0,-18,32,40,8,0xbfd7ff,2);L(0,10,-40,34,12,0xffffff,3);
const p=new THREE.PMREMGenerator(r);const t=p.fromScene(s,.04).texture;p.dispose();return t}
const mt=m=>new THREE.MeshStandardMaterial({color:MC[m],metalness:1,roughness:.2,envMapIntensity:1.3});
const DIA=()=>new THREE.MeshStandardMaterial({color:0xdff1ff,metalness:.2,roughness:.03,flatShading:true,envMapIntensity:2.4});
function gem(s){const g=new THREE.Group(),D=DIA();
const c=new THREE.Mesh(new THREE.CylinderGeometry(s*.6,s,s*.32,12),D);c.position.y=s*.16;
const p=new THREE.Mesh(new THREE.ConeGeometry(s,s*.7,12),D);p.rotation.x=Math.PI;p.position.y=-s*.35;g.add(c,p);return g}
function flower(m,n,r){const g=new THREE.Group(),M=mt(m),G=new THREE.SphereGeometry(1,24,14);
for(let L=0;L<2;L++){const k=L?.72:1;for(let i=0;i<n;i++){const pv=new THREE.Group(),p=new THREE.Mesh(G,M);
p.scale.set(.36*r*k,.11*r*k,.62*r*k);p.position.z=.6*r*k;p.rotation.x=-.2;pv.rotation.y=(i+L*.5)/n*Math.PI*2;pv.position.y=L*.07*r;pv.add(p);g.add(pv)}}
const d=gem(.3*r);d.position.y=.13*r;g.add(d);return g}
function build(t,m){const o=new THREE.Group(),M=mt(m);
const add=(g,x,y,z,s,rx)=>{g.position.set(x,y,z);g.scale.setScalar(s);if(rx)g.rotation.x=rx;o.add(g)};
const cyl=(x,y,h)=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,h,8),M);c.position.set(x,y,0);o.add(c)};
const tube=(pts,closed,r)=>{const c=new THREE.CatmullRomCurve3(pts,closed);o.add(new THREE.Mesh(new THREE.TubeGeometry(c,96,r,8,closed),M))};
if(t==="ring"||t==="ring2"){o.add(new THREE.Mesh(new THREE.TorusGeometry(1,.085,20,80),M));
add(flower(m,t==="ring"?6:5,1),0,1.06,0,t==="ring"?.62:.52);
if(t==="ring2")[-1,1].forEach(s=>{const l=new THREE.Mesh(new THREE.SphereGeometry(1,16,10),M);l.scale.set(.3,.05,.12);l.position.set(s*.42,1,0);l.rotation.z=-s*.4;o.add(l)});
o.rotation.x=.3;o.position.y=-.4}
else if(t==="ear"){[-.9,.9].forEach(x=>{add(flower(m,8,1),x,.8,0,.5,Math.PI/2);cyl(x,.25,.9);add(flower(m,5,1),x,-.3,0,.3,Math.PI/2)});o.position.y=.1}
else if(t==="pend"){const P=[];for(let i=0;i<=14;i++){const x=-1.4+i*.2;P.push(new THREE.Vector3(x,-.5+1.7*(x/1.4)*(x/1.4),0))}tube(P,false,.022);
add(flower(m,8,1),0,-.62,0,.55,Math.PI/2);o.position.y=.2}
else if(t==="brac"){const P=[];for(let k=0;k<24;k++){const a=k/24*Math.PI*2;P.push(new THREE.Vector3(1.5*Math.cos(a),0,.95*Math.sin(a)))}tube(P,true,.035);
for(let j=0;j<8;j++){const a=j/8*Math.PI*2;add(flower(m,j%2?6:5,1),1.5*Math.cos(a),.04,.95*Math.sin(a),.24)}o.rotation.x=.9;o.position.y=.3}
else{[-.85,.85].forEach(x=>add(flower(m,6,1),x,.2,0,.55,Math.PI/2))}
return o}
function tick(t){const dt=Math.min(.05,(t-last)/1e3);last=t;
items.forEach(it=>{if(!it.vis)return;if(!reduce&&!it.drag){it.pv.rotation.y+=dt*.55;it.dirty=1}
if(it.dirty){R3.render(it.scene,CAM);it.ctx.clearRect(0,0,512,512);it.ctx.drawImage(R3.domElement,0,0);it.dirty=0}});
requestAnimationFrame(tick)}
function mount3d(){if(!window.THREE)return;
try{if(!R3){R3=new THREE.WebGLRenderer({antialias:true,alpha:true});R3.setSize(512,512);R3.toneMapping=THREE.ACESFilmicToneMapping;R3.toneMappingExposure=1.1;R3.outputEncoding=THREE.sRGBEncoding;ET=env3(R3);
CAM=new THREE.PerspectiveCamera(34,1,.1,50);CAM.position.set(0,1.6,6.2);CAM.lookAt(0,.45,0);
IO=new IntersectionObserver(es=>es.forEach(e=>{const it=e.target._it;if(it){it.vis=e.isIntersecting;it.dirty=1}}))}
items=[];const g=document.getElementById("grid").children;
const L=[[document.getElementById("heroArt"),"ring","rose"],[document.getElementById("aboutArt"),"pend","yellow"]];
P.forEach((p,i)=>L.push([g[i].querySelector(".art"),p.t,p.m]));
L.forEach(([el,t,m])=>{const cv=document.createElement("canvas");cv.width=cv.height=512;cv._it=null;
const sc=new THREE.Scene();sc.environment=ET;const dl=new THREE.DirectionalLight(0xffffff,.5);dl.position.set(2,4,5);sc.add(dl);
const pv=new THREE.Group();pv.add(build(t,m));sc.add(pv);
const it={ctx:cv.getContext("2d"),scene:sc,pv,vis:false,dirty:1,drag:false};cv._it=it;items.push(it);
let x0=0;cv.addEventListener("pointerdown",e=>{it.drag=true;x0=e.clientX;cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
cv.addEventListener("pointermove",e=>{if(it.drag){pv.rotation.y+=(e.clientX-x0)*.012;x0=e.clientX;it.dirty=1}});
const up=()=>{it.drag=false;cv.style.cursor="grab"};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.setAttribute("aria-hidden","true");el.replaceChildren(cv);IO.observe(cv)});
if(!started){started=1;requestAnimationFrame(tick)}}catch(e){console.error(e)}}
function setLang(l){const d=T[l];document.documentElement.lang=l;document.title=d.title;
document.querySelector('meta[name=description]').content=d.desc;
document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=d[e.dataset.i18n]);
document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
document.getElementById("grid").innerHTML=P.map((p,i)=>`<article class="card"><div class="art">${art(p.t,p.m)}</div><div class="info"><h3>${d.n[i]}</h3><p class="spec">${d.spec.replace("{m}",d["m_"+p.m]).replace("{ct}",p.ct)}</p><div class="price">$${fmt(p.usd)}<small>≈ ${fmt(p.usd*390)} ֏</small></div></div></article>`).join("");
mount3d();try{localStorage.setItem("be-lang",l)}catch(e){}}
document.querySelector(".lang").addEventListener("click",e=>{const l=e.target.dataset&&e.target.dataset.l;if(l)setLang(l)});
let L="hy";try{const s=localStorage.getItem("be-lang");if(s&&T[s])L=s;else{const n=(navigator.language||"").slice(0,2);L=T[n]?n:"hy"}}catch(e){}
setLang(L);
</script>
</body>
